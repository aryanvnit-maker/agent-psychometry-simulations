services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kalibr
      POSTGRES_USER: kalibr
      POSTGRES_PASSWORD: kalibr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/telemetry/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  postgres_data:
