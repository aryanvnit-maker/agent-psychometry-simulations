version: "3"

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: always

  db:
    image: postgres:13.0
    env_file: judge0.conf
    restart: always

  redis:
    image: redis:6.0
    command: [
      "bash", "-c",
      "docker-entrypoint.sh --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
    ]
    env_file: judge0.conf
    restart: always
